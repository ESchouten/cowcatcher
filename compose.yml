services:
  aidetector:
    image: "ghcr.io/eschouten/ai-detector:latest"
    ipc: host
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    ulimits:
      memlock: -1
      stack: 67108864

    volumes:
      - ./example:/data
    ports:
      - "8765:8765"
    gpus:
      - count: all

  web:
    image: "ghcr.io/eschouten/ai-detector-web:latest"
    depends_on:
      - aidetector
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "80:3000"
    volumes_from:
      - aidetector
