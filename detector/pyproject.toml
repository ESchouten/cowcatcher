[project]
name = "aidetector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "litellm>=1.81.6",
    "opencv-stubs>=0.1.1",
    "pydantic>=2.12.5",
    "tiktoken[openai]>=0.12.0",
    "ultralytics>=8.4.10",
    "typing-extensions>=4.15.0",
]

[project.optional-dependencies]
default = [
    "onnx>=1.20.1",
    "onnxslim>=0.1.87",
    "onnxruntime>=1.24.1",
]
windowsml = [
    "onnx>=1.20.1",
    "onnxslim>=0.1.87",
    "onnxruntime-windowsml>=1.23.3",
    "wasdk-microsoft-windows-ai-machinelearning[all]>=1.8.260209005",
    "wasdk-microsoft-windows-applicationmodel-dynamicdependency-bootstrap>=1.8.260209005",
]
dazzlecow = [
    "pandas>=2.2.0",
    "pytorch-metric-learning>=2.0.0",
    "scikit-learn>=1.7.0",
    "scipy>=1.11.0",
    "timm>=1.0.0",
    "transformers>=4.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
main = "aidetector:main"
generate-schema = "aidetector.utils.generate_schema:main"
train-dazzlecow = "aidetector.dazzlecow.train:train_main"
build-dazzlecow-gallery = "aidetector.dazzlecow.train:gallery_main"
prepare-dazzlecow = "aidetector.dazzlecow.prepare:main"
prepare-calves8 = "aidetector.dazzlecow.calves8:main"
evaluate-dazzlecow = "aidetector.dazzlecow.train:evaluate_main"
benchmark-dazzlecow = "aidetector.dazzlecow.benchmark:main"
benchmark-dazzlecow-video = "aidetector.dazzlecow.video_benchmark:main"
benchmark-dazzlecow-enrollment = "aidetector.dazzlecow.enrollment_benchmark:main"
dazzlecow-enrollment = "aidetector.dazzlecow.enrollment:main"
prepare-dazzlecow-folds = "aidetector.dazzlecow.folds:main"
prepare-dazzlecow-identity-fold = "aidetector.dazzlecow.folds:identity_disjoint_main"

[dependency-groups]
dev = [
    "ruff>=0.14.14",
    "ty>=0.0.14",
    "pyinstaller>=6.18.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true
