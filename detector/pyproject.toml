[project]
name = "aidetector"
version = "0.1.0"
description = "Configurable real-time video detection and alerting service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "lap>=0.5.12",
    "litellm>=1.81.6",
    "numpy>=1.26.0",
    "opencv-python>=4.6.0",
    "pydantic>=2.12.5",
    "requests>=2.32.0",
    "safetensors>=0.4.5",
    "timm==1.0.28",
    "tiktoken[openai]>=0.12.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "ultralytics>=8.4.10",
]

[project.optional-dependencies]
default = [
    "onnx>=1.20.1",
    "onnxslim>=0.1.87",
    "onnxruntime>=1.23.2,<1.24; python_version < '3.11'",
    "onnxruntime>=1.24.1; python_version >= '3.11'",
]
nvidia = [
    "onnx>=1.20.1",
    "onnxslim>=0.1.87",
    "onnxruntime-gpu>=1.24.1; python_version >= '3.11'",
]
windowsml = [
    "onnx>=1.20.1",
    "onnxslim>=0.1.87",
    "onnxruntime-windowsml>=1.23.3",
    "wasdk-microsoft-windows-ai-machinelearning[all]>=1.8.260209005",
    "wasdk-microsoft-windows-applicationmodel-dynamicdependency-bootstrap>=1.8.260209005",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
main = "aidetector:main"
generate-schema = "aidetector.utils.generate_schema:main"

[dependency-groups]
dev = [
    "opencv-stubs>=0.1.1",
    "ruff>=0.14.14",
    "ty>=0.0.14",
    "pyinstaller>=6.18.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/aidetector"]
