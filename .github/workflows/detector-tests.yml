name: Detector Tests

on:
  pull_request:
    paths:
      - "detector/**"
      - "config/*.schema.json"
      - ".github/workflows/detector-tests.yml"
  push:
    branches:
      - "**"
    paths:
      - "detector/**"
      - "config/*.schema.json"
      - ".github/workflows/detector-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    defaults:
      run:
        working-directory: detector
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Ruff
        run: uv run --locked --extra default ruff check src/aidetector tests

      - name: Format
        run: uv run --locked --extra default ruff format --check src/aidetector tests

      - name: Compile
        run: uv run --locked --extra default python -m compileall src/aidetector

      - name: Type check
        run: uv run --locked --extra default ty check src/aidetector

      - name: Verify generated schemas
        run: |
          uv run --locked --extra default generate-schema
          git diff --exit-code -- ../config/config.schema.json ../config/metadata.schema.json

      - name: Pytest
        run: uv run --locked --extra default pytest

      - name: Build wheel
        run: uv build --wheel
