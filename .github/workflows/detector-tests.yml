name: Detector Tests

on:
  pull_request:
    paths:
      - "detector/**"
      - "config/**"
      - "example/**"
      - ".github/workflows/detector-tests.yml"
  push:
    branches:
      - "**"
    paths:
      - "detector/**"
      - "config/**"
      - "example/**"
      - ".github/workflows/detector-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    defaults:
      run:
        working-directory: detector
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Ruff
        run: uv run ruff check src/aidetector tests

      - name: Compile
        run: uv run python -m compileall src/aidetector

      - name: Pytest
        run: uv run pytest
